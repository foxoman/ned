id = "nedls-language-server"
name = "nedls"
description = "Nim: ned's engine as a language server (nedls) — completion, hover, definition, references, rename, formatting, quick fixes and problems as you type, without nimsuggest."
version = "6.49.0"
schema_version = 1
authors = ["Sultan Al Isaiee (@foxoman) <sultan@foxoman.net>"]
repository = "https://github.com/foxoman/nedls-zed"

# (Nim itself — its file types and colours — comes from the Nim extension; this one adds the server)
[language_servers.nedls]
name = "nedls"
languages = ["Nim"]

[language_servers.nedls.language_ids]
"Nim" = "nim"
