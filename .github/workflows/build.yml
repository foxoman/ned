# Checks that ned builds on Linux, macOS, Termux (Android) and Windows (WSL, and native — experimental) on every push,
# pull request and version tag, checks its speed, runs it in a real pseudo-terminal and packages the VS Code
# extension. Nothing is published: people build their own with nimble (or install.sh, which uses it).
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # (lto: a build with link-time optimisation checked too — src/ned.nims)
          - { name: linux-x86_64,       os: ubuntu-latest,    nim: stable, cc: gcc,   out: ned-linux-x86_64, lto: -d:lto }
          - { name: linux-x86_64-clang, os: ubuntu-latest,    nim: stable, cc: clang, out: ned-linux-x86_64-clang, lto: "" }
          - { name: linux-nim-2.2.4,    os: ubuntu-latest,    nim: "2.2.4", cc: gcc,  out: ned-linux-nim-2.2.4, lto: "" }
          - { name: macos-arm64,        os: macos-latest,     nim: stable, cc: clang, out: ned-macos-arm64, lto: -d:lto }
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          nim c -d:release --opt:speed -d:strip --hints:off ${{ matrix.lto }} --cc:${{ matrix.cc }} -o:${{ matrix.out }} src/ned.nim
          # the formatter and the language server on their own
          o=${{ matrix.out }}
          nim c -d:release --opt:speed -d:strip --hints:off ${{ matrix.lto }} --cc:${{ matrix.cc }} -o:nedfmt-${o#ned-} src/nedfmt.nim
          nim c -d:release --opt:speed -d:strip --hints:off ${{ matrix.lto }} --cc:${{ matrix.cc }} -o:nedls-${o#ned-} src/nedls.nim
      - name: Command-line checks
        run: |
          o=${{ matrix.out }}
          ./nedfmt-${o#ned-} --version
          ./nedls-${o#ned-} --version
          printf 'let  x=1\n' | ./nedfmt-${o#ned-} --stdin-name=x.nim - | grep -qx 'let x = 1'
          ./${{ matrix.out }} --version
          ./${{ matrix.out }} --help
          ./${{ matrix.out }} --check
          ./${{ matrix.out }} --default-settings > /dev/null
          ./${{ matrix.out }} --bench src/ned/nim/index/types.nim > /dev/null
          f=$(mktemp -d)/f.nim && printf 'proc g(a:int):int=\n  a+1\n' > "$f"
          ./${{ matrix.out }} --format "$f" && ./${{ matrix.out }} --format --check "$f"
          if ./${{ matrix.out }} --no-such-option 2>/dev/null; then echo "unknown option accepted"; exit 1; fi
      - name: Run it in a pseudo-terminal (draws, built-in terminal, piped input, quit)
        run: python3 .github/ci/pty_smoke.py ./${{ matrix.out }}
      - name: Performance — startup time, memory, time per frame (fails when over .github/ci/bench-budget.json)
        if: matrix.name == 'linux-x86_64' || matrix.name == 'macos-arm64'
        run: python3 .github/ci/bench.py ./${{ matrix.out }}
      - name: Performance — the longest waits while working on ned's own source, completion times, memory with the engine worker (tests/perf/budget.json)
        if: matrix.name == 'linux-x86_64'
        run: python3 tests/perf/rounds.py ./${{ matrix.out }}
      - name: The language server's tests (every feature, then 2000 random edits)
        if: matrix.name == 'linux-x86_64'
        run: python3 tests/lsp/tnedls.py ./nedls-${{ matrix.name }}

  cross:
    # binaries for the machines GitHub has no free runner for: built here, run by you
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-latest
            out: ned-linux-arm64
            setup: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
            flags: --cpu:arm64 --gcc.exe:aarch64-linux-gnu-gcc --gcc.linkerexe:aarch64-linux-gnu-gcc
          - name: macos-x86_64
            os: macos-latest
            out: ned-macos-x86_64
            setup: "true"
            flags: --cpu:amd64 --passC:"-arch x86_64" --passL:"-arch x86_64"
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          ${{ matrix.setup }}
          nim c -d:release --opt:speed -d:strip -d:lto --hints:off ${{ matrix.flags }} -o:${{ matrix.out }} src/ned.nim
          o=${{ matrix.out }}
          nim c -d:release --opt:speed -d:strip -d:lto --hints:off ${{ matrix.flags }} -o:nedfmt-${o#ned-} src/nedfmt.nim
          nim c -d:release --opt:speed -d:strip -d:lto --hints:off ${{ matrix.flags }} -o:nedls-${o#ned-} src/nedls.nim
          file ${{ matrix.out }}

  termux:
    # Termux (Android, arm64): built as the Termux package is, with zig against musl (tests/build/termux.sh) — the
    # build checked, nothing published. The programs then need nothing from Android's own C library, which has no
    # posix_spawn before Android 9 — the Android NDK's API 24 could not build std/osproc.
    name: termux-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with zig, and the Termux package
        run: |
          python3 -m pip install --break-system-packages --target "$RUNNER_TEMP/zig" ziglang==0.17.0
          ZIG="$RUNNER_TEMP/zig/ziglang/zig" bash tests/build/termux.sh out
          file out/ned out/nedfmt out/nedls
          ls -la out/*.deb

  windows-wsl:
    # ned is a Unix terminal program: on Windows it runs inside WSL, in Windows Terminal
    name: windows-wsl
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - name: Keep Unix line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: build-essential curl xz-utils python3 file
      - name: Install Nim in WSL
        run: |
          curl -sSfL https://nim-lang.org/download/nim-2.2.4-linux_x64.tar.xz -o /tmp/nim.tar.xz
          tar -xJf /tmp/nim.tar.xz -C "$HOME"
      - name: Build and check
        run: |
          export PATH="$HOME/nim-2.2.4/bin:$PATH"
          nim c -d:release --opt:speed -d:strip --hints:off -o:ned src/ned.nim
          ./ned --version
          ./ned --check
          python3 .github/ci/pty_smoke.py ./ned

  windows:
    # ned built for Windows itself (experimental, since 6.21): the console is its terminal (Windows Terminal, or
    # the console of Windows 10 1809 and later), ConPTY its terminal panel, Git for Windows' sh its shell for
    # commands. A step that fails does not fail the run
    name: windows-x86_64
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep Unix line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          nim c -d:release --opt:speed -d:strip --hints:off -o:ned-windows-x86_64.exe src/ned.nim
          nim c -d:release --opt:speed -d:strip --hints:off -o:nedfmt-windows-x86_64.exe src/nedfmt.nim
          nim c -d:release --opt:speed -d:strip --hints:off -o:nedls-windows-x86_64.exe src/nedls.nim
      - name: Command-line checks
        run: |
          ./nedfmt-windows-x86_64.exe --version
          ./nedls-windows-x86_64.exe --version
          printf 'let  x=1\n' | ./nedfmt-windows-x86_64.exe --stdin-name=x.nim - | tr -d '\r' | grep -qx 'let x = 1'
          ./ned-windows-x86_64.exe --version
          ./ned-windows-x86_64.exe --help
          ./ned-windows-x86_64.exe --check
          ./ned-windows-x86_64.exe --default-settings > /dev/null
          f="$RUNNER_TEMP/f.nim" && printf 'proc g(a:int):int=\n  a+1\n' > "$f"
          ./ned-windows-x86_64.exe --format "$f" && ./ned-windows-x86_64.exe --format --check "$f"
      - name: The formatter's tests
        run: nim r -d:release --hints:off tests/unit/tformat.nim

  vscode:
    # the VS Code extension (editors/vscode): nedls in VS Code, as a .vsix to install — made with Python alone (the
    # extension's language client is its own, no npm packages), its version checked against ned's
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package it
        run: bash tests/build/vscode.sh dist-vscode
      - name: Check it
        run: |
          v=$(python3 -c 'import json; print(json.load(open("editors/vscode/package.json"))["version"])')
          for f in extension/extension.js extension/package.json; do
            unzip -l "dist-vscode/vscode-nedls-$v.vsix" | grep -q " $f\$" || { echo "$f is not in the .vsix"; exit 1; }
          done
