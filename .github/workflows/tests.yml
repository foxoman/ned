# ned's tests, on every push and pull request:
#   unit  — the Nim index, the C index, the formatters and the regular expressions, on Linux and macOS
#   nedls — the language server driven by a test client, and by the VS Code extension's client; the formatter
#           checked by Nim's own parser
#   plugins — the plugins' host with the example plugins, the API, a NimScript language server (ned --lsp-bridge);
#           and the documentation: the references are what the sources make, every link goes somewhere (tests/docs)
#   windows — on Windows itself: the unit tests of ned's own logic; ned.exe in a console (ConPTY), nedls, nedfmt
#   ui    — the whole editor driven through tmux, its screen read back (tests/ui), in four parts side by side,
#           with the tools the tests use installed (language servers, clangd, gdb, shells, an SSH server)
#   scoreboard — the engines against nimsuggest and clangd on fixed files, each score against its minimum
#   grader — Go to definition on ned's own source against Nim 2.4's own reading of it (nifgrade.py), at least 99%
#   soak  — ten minutes of editing ned's own source: ned and its engine worker may not grow, nor make an error
# Started by hand (Actions › tests › Run workflow) it can also fuzz ned and compare its Nim engine with nimsuggest.
name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "seconds of fuzzing for each mode (0: no fuzzing)"
        default: "0"
      engine:
        description: "compare the Nim engine with nimsuggest (about an hour)"
        type: boolean
        default: false

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unit tests
        # (every one, each failure named: one that fails does not hide those after it)
        run: |
          failed=""
          for t in tests/unit/t*.nim; do nim r -d:release --hints:off "$t" || { echo "::error::$t failed"; failed="$failed $t"; }; done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

  plugins:
    # the plugins' host (nim e, and compiled) with the example plugins, the API played by a test; a language
    # server written in NimScript through ned --lsp-bridge
    name: plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: The plugin host, the API, the examples, the LSP bridge
        run: |
          nim c -d:release --hints:off -o:ned src/ned.nim
          python3 tests/plugins/tplugins.py ./ned --native
          python3 tests/plugins/tbundled.py --native
      - name: The documentation (references made from the sources, links)
        run: |
          export XDG_CONFIG_HOME=$(mktemp -d)        # (no settings of anyone's in the references)
          ./ned --doc-settings | diff -u docs/reference/settings.md - ||
            { echo "::error::docs/reference/settings.md is not what ned --doc-settings makes: run it"; exit 1; }
          ./ned --doc-commands | diff -u docs/reference/commands.md - ||
            { echo "::error::docs/reference/commands.md is not what ned --doc-commands makes: run it"; exit 1; }
          python3 tests/docs/apiref.py --check
          python3 tests/docs/sourcemap.py --check       # docs/dev/source-map.md: every file, what it is
          python3 tests/docs/links.py
          python3 tests/docs/comments.py              # every file and routine says what it is
          python3 tests/docs/wiring.py ./ned          # menus name real commands, settings declared and read

  nedls:
    # the language server driven by a test client, and the formatter checked by Nim's own parser
    name: nedls and the parser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: nedls (every feature, then 2000 random edits)
        run: |
          nim c -d:release --hints:off -o:nedls src/nedls.nim
          python3 tests/lsp/tnedls.py ./nedls
      - name: The VS Code extension's language client against nedls (VS Code played by a stand-in)
        run: node tests/vscode/test_extension.js ./nedls
      - name: The formatter and Nim's parser (463 files of Nim's own source)
        run: |
          root=$(dirname "$(dirname "$(readlink -f "$(command -v nim)")")")
          if [ -f "$root/compiler/parser.nim" ] && [ -f "$root/lib/system.nim" ]; then
            tests/format/parsecheck.sh "$root"
          else
            echo "this Nim has no compiler sources: skipped"
          fi

  ui:
    name: ui (part ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The tools the tests use
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux clangd gdb lldb zsh fish hunspell-en-us openssh-server
          npm install -g vscode-langservers-extracted
          # sql-language-server: what npm gives it today does not start (vscode-languageserver-protocol 3.18 no longer
          # has the file it loads) — installed in a folder of its own, with that library held at 3.17
          mkdir -p ~/sqlls && cd ~/sqlls &&
            echo '{"private": true, "overrides": {"vscode-languageserver-protocol": "3.17.5"}}' > package.json &&
            npm install --no-audit --no-fund sql-language-server@1.7.1 && cd - &&
            echo "NED_TEST_PATH=$HOME/sqlls/node_modules/.bin" >> "$GITHUB_ENV"
          # vscode-js-debug (JavaScript and TypeScript debugging), where ned's own install puts it
          mkdir -p ~/.local/share && curl -fsSL "$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/microsoft/vscode-js-debug/releases/latest |
            grep -o 'https://[^"]*js-debug-dap-v[^"]*tar.gz' | head -1)" | tar xz -C ~/.local/share ||
            echo "vscode-js-debug did not download: its tests are skipped"
          pip install --break-system-packages debugpy pytest coverage || pip install debugpy pytest coverage
          # (nimlangserver from its own release with its lock file: `nimble install nimlangserver` takes the newest of
          # what it needs, and faststreams 0.6 does not build in it)
          (git clone -q --depth 1 -b v1.16.0 https://github.com/nim-lang/langserver /tmp/langserver &&
           cd /tmp/langserver && nimble install -y --useSystemNim) ||
            echo "nimlangserver did not build: its tests are skipped"
          tests/ui/ssh-setup.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Neovim for the vim oracle
        # (the cases are Neovim's — a plain Vim answers too, given nvim's defaults by the oracle's script — pinned so
        # the oracle answers the same thing every run)
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/v0.12.4/nvim-linux-x86_64.tar.gz
          tar -C /tmp -xzf /tmp/nvim.tar.gz
          echo /tmp/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
      - name: Build
        run: nim c -d:release --hints:off -o:ned src/ned.nim
      - name: UI tests
        env:
          NED_TEST_SSH: "1"
          NED_UI_FULL: "1"         # (a failure's whole screen in the log, not its first 400 characters)
        run: python3 tests/ui/run.py ./ned --shard ${{ matrix.shard }}/4

  fuzz:
    if: github.event_name == 'workflow_dispatch' && inputs.fuzz_seconds != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build with stack traces
        run: nim c -d:release --stackTrace:on --lineTrace:on --hints:off -o:ned_debug src/ned.nim
      - name: Fuzz
        env:
          NEDBIN: ./ned_debug
        run: tests/fuzz/batch.sh ${{ inputs.fuzz_seconds }} mixed vim palette refactor git fixes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-logs
          path: /tmp/ned-fuzz-*-logs

  windows:
    # ned on Windows itself, run: the unit tests of its own logic, then the three programs built here and started
    # as a person would — the editor in a console (ConPTY), a key typed, the file saved, quit; nedls over the
    # Language Server Protocol; nedfmt (.github/ci/win_smoke.py)
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep Unix line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unit tests (ned's own logic)
        run: |
          for t in ttext tencodings tregex twebdata tweb twebfmt tformat timages tnimapis; do
            nim r -d:release --hints:off "tests/unit/$t.nim" || exit 1
          done
      - name: Build
        run: |
          nim c -d:release --hints:off -o:ned.exe src/ned.nim
          nim c -d:release --hints:off -o:nedls.exe src/nedls.nim
          nim c -d:release --hints:off -o:nedfmt.exe src/nedfmt.nim
      - name: Run them (ConPTY, LSP)
        run: |
          python -m pip install --quiet pywinpty
          python .github/ci/win_smoke.py ned.exe nedls.exe nedfmt.exe

  scoreboard:
    # the engines' scoreboard: ned's Nim engine against nimsuggest and nedls' answers (standard-library modules), its
    # errors as you type against nim check; its C engine against clangd (Lua's sources) and on C++ (tinyxml2's);
    # nedls against nimlangserver and the formatter against nph, head to head — each score against its minimum in
    # tests/engine/scoreboard.json
    name: engine scoreboard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          # (Nim 2.2's nimsuggest: the yardstick. Nim 2.4's `use` leaves out some uses of a variable and puts `result`
          # where the routine's body starts — the scores then measure nimsuggest, not ned)
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y clangd
      - name: The engines as programs
        run: |
          tests/engine/build.sh ./ned-engine
          nim c -d:release --hints:off -o:nedls src/nedls.nim
          nim c -d:release --hints:off -o:ned-cengine tests/engine/cdriver.nim
          nim c -d:release --opt:speed --hints:off -o:nedfmt src/nedfmt.nim
          git clone -q --depth 1 https://github.com/lua/lua /tmp/lua
          git clone -q --depth 1 https://github.com/leethomason/tinyxml2 /tmp/tinyxml2
      - name: The others, head to head (nimlangserver, nph)
        continue-on-error: true
        run: |
          nimble install -y nph
          git clone -q --depth 1 -b v1.16.0 https://github.com/nim-lang/langserver /tmp/langserver
          cd /tmp/langserver && nimble install -y --useSystemNim     # (its lock file: see the UI job)
      - name: The scores
        run: |
          set +e
          more=""
          nls=$(command -v nimlangserver) && more="$more --nimlangserver $nls"
          nph=$(command -v nph) && more="$more --nedfmt ./nedfmt --nph $nph"
          python3 tests/engine/scoreboard.py --engine ./ned-engine --nedls ./nedls --cdriver ./ned-cengine \
            --c-files /tmp/lua/lapi.c /tmp/lua/lcode.c /tmp/lua/ltable.c /tmp/lua/lvm.c /tmp/lua/lstring.c \
            --cpp-files /tmp/tinyxml2/tinyxml2.cpp /tmp/tinyxml2/xmltest.cpp $more \
            --n 40 > /tmp/scores.txt 2>&1
          code=$?
          cat /tmp/scores.txt
          sed -n '/^| |/,$p' /tmp/scores.txt | grep -v '^left out\|^::' >> "$GITHUB_STEP_SUMMARY"
          exit $code

  grader:
    # ned's Go to definition graded by the compiler: Nim 2.4's `nim nif` resolves every name of ned's own source, and
    # the engine must agree on at least 99% of the uses of each part (tests/engine/nifgrade.py; it says which differ)
    name: Go to definition against the compiler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: The engine as a program
        run: tests/engine/build.sh ./ned-engine
      - name: The grades
        run: |
          for m in src/nedfmt.nim src/ned/nim/index.nim src/nedls.nim; do
            python3 tests/engine/nifgrade.py $m --driver ./ned-engine --min 99 --show 10 | tee -a "$GITHUB_STEP_SUMMARY" || exit 1
          done

  soak:
    # ten minutes of editing a copy of ned's own source, at random (tests/soak/soak.py): fails when ned and its engine
    # worker grow by more than 40 MB between the first stretch and the last, ned stops answering or makes an internal
    # error. To see what grew: tests/memory/memprobe.py, then the soak with --mem-log
    name: soak (memory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build
        run: nim c -d:release --opt:speed --hints:off -o:ned src/ned.nim
      - name: The session
        run: python3 tests/soak/soak.py ./ned --minutes 10 --seed 4242 --grow-mb 40 | tee -a "$GITHUB_STEP_SUMMARY"

  engine:
    if: github.event_name == 'workflow_dispatch' && inputs.engine
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: The corpus's packages
        run: nimble install -y chronos jsony pixie jester cligen karax vmath || true
      - name: Compare with nimsuggest
        run: |
          tests/engine/build.sh
          NED_PKGS=$HOME/.nimble/pkgs2 tests/engine/corpus.sh /tmp/engine-out 60 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-comparison
          path: /tmp/engine-out
